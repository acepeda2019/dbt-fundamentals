version: 2

models:
  - name: stg_jaffle_shop__customers
    description: Cleaned and renamed customer data from the Jaffle Shop source system.
    columns:
      - name: customer_id
        data_type: bigint
        description: '{{ doc("customer_id") }}'
        data_tests:
          - unique
          - not_null

      - name: first_name
        data_type: string
        description: '{{ doc("customer_first_name") }}'

      - name: last_name
        data_type: string
        description: '{{ doc("customer_last_name") }}'

      - name: customer_name
        data_type: string
        description: The customer's full name, concatenated from `first_name` and `last_name`.

  - name: stg_jaffle_shop__orders
    description: Cleaned and renamed order data from the Jaffle Shop source system.
    columns:
      - name: order_id
        data_type: bigint
        description: '{{ doc("order_id") }}'
        data_tests:
          - unique
          - not_null

      - name: customer_id
        data_type: bigint
        description: '{{ doc("customer_id") }}'
        data_tests:
          - relationships: # ensures that each customer_id in orders exists in customers
              arguments:
                to: ref('stg_jaffle_shop__customers')
                field: customer_id

      - name: order_date
        data_type: date
        description: '{{ doc("order_date") }}'

      - name: order_status
        data_type: string
        description: '{{ doc("order_status") }}'
        data_tests:
          - accepted_values:
              arguments:
                values: ['completed', 'returned', 'return_pending', 'placed', 'shipped']