sources:
  - name: jaffle_shop
    database: raw
    schema: jaffle_shop
    description: Jaffle Shop data

    tables:
      - name: customers
        description: Raw customer data
        columns:
          - name: id
            data_type: bigint
            description: '{{ doc("customer_id") }}'
          - name: first_name
            data_type: string
            description: '{{ doc("customer_first_name") }}'
          - name: last_name
            data_type: string
            description: '{{ doc("customer_last_name") }}'
      - name: orders
        description: Raw order data
        config:
          freshness:
            warn_after: {count: 1, period: day}
            error_after: {count: 3, period: day}
          loaded_at_field: 'order_date::timestamp'
          
        columns:
          - name: id
            data_type: bigint
            description: '{{ doc("order_id") }}'
            data_tests:
              - unique
              - not_null
          - name: user_id
            data_type: bigint
            description: '{{ doc("customer_id") }}'
          - name: order_date
            data_type: date
            description: '{{ doc("order_date") }}'
          - name: status
            data_type: string
            description: '{{ doc("order_status") }}'
            data_tests:
              - accepted_values:
                  arguments:
                    values: ['completed', 'placed', 'return_pending', 'returned', 'shipped']