macros:
  - name: cents_to_dollars
    description: converts cents to dollars and round to the nearest decimal specified
    arguments:
      - name: column_name
        description: the column name of the cents column to convert
        type: integer
      - name: decimal
        description: decimal value to round to, default is set to 2
        type: integer
  
  - name: union_table_by_prefix
    description: unions all tables withing a schema containing a given prefix. column names must match across all tables
    arguments:
      - name: database
        description: the name of the database
      - name: schema
        description: the name of the schema
      - name: prefix
        description: the prefix of the model names to search
      - name: columns
        description: list of columns used in the union. default is ['*']

  - name: find_orphaned_tables
    description: >
      Compares the warehouse's information_schema against the dbt manifest (graph.nodes) to find
      tables/views that exist in the given database but aren't defined by any enabled model,
      snapshot, or seed in the project. Logs a DROP statement for each orphan found - it only
      reports, it never executes anything - so the statements are meant to be reviewed and run
      manually to clear out stale objects (e.g. from renamed/removed models) from prod.
    arguments:
      - name: database
        description: the name of the database/catalog to audit. default is 'analytics'
      - name: schemas
        description: list of schemas to check. default is ['intermediate','snapshots','seeds','staging','marts']