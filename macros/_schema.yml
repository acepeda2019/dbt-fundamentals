macros:
  - name: cents_to_dollars
    description: converts cents to dollars and round to the nearest decimal specified
    arguments:
      - name: column_name
        description: the column name of the cents column to convert
        type: integer
      - name: decimal
        description: decimal value to round to, default is set to 2
        type: integer
  
  - name: union_table_by_prefix
    description: unions all tables withing a schema containing a given prefix. column names must match across all tables
    arguments:
      - name: database
        description: the name of the database
      - name: schema
        description: the name of the schema
      - name: prefix
        description: the prefix of the model names to search
      - name: columns
        description: list of columns used in the union. default is ['*']

  - name: find_orphaned_tables
    description: >
      Compares the warehouse's information_schema against the dbt manifest (graph.nodes) to find
      tables/views that exist in the given database but aren't defined by any enabled model,
      snapshot, or seed in the project. Logs a DROP statement for each orphan found - it only
      reports, it never executes anything - so the statements are meant to be reviewed and run
      manually to clear out stale objects (e.g. from renamed/removed models) from prod.
    arguments:
      - name: database
        description: the name of the database/catalog to audit. default is 'analytics'
      - name: schemas
        description: list of schemas to check. default is ['intermediate','snapshots','seeds','staging','marts']

  - name: find_datatypes
    description: >
      Given a single relation, queries its live columns via adapter.get_columns_in_relation and
      renders each one as a `- name: ... / data_type: ...` yml entry (lowercased). Meant as a
      codegen helper for pasting a model's `columns:` block into a schema.yml.
    arguments:
      - name: model
        description: the relation to introspect, e.g. ref('some_model') or source('some_source', 'some_table')

  - name: find_all_datatypes
    description: >
      Loops every enabled model/snapshot/seed (non-ephemeral) in the manifest, resolves each one's
      real relation for the current target, and queries its live columns via
      adapter.get_columns_in_relation - so it reflects whatever's actually built in the
      environment you run it against (--target dev vs --target prod), not just what's documented
      in yml. Logs a name/data-type listing per table, indented under the table name, to help spot
      undocumented columns that still need to be filled in.

  - name: date_window
    description: >
      Returns a boolean date-filter predicate (no leading `and`) for a WHERE clause, chosen based
      on how the model is being built. In `dev`, always filters to the last `lookback_days` from
      current_date, regardless of incremental state - this caps dev build volume/cost and never
      references `{{ this }}`, so it's safe on a full-refresh/first build. Outside `dev`, only
      filters when `is_incremental()` is true, using `max(column_name) from {{ this }}` as the
      anchor - this is the classic incremental-merge lookback window for catching late-arriving
      data. Outside `dev` on a full build/first run, neither branch fires and no filter is applied,
      so the full history builds. `lookback_days` defaults to the `lookback_days` dbt var (falling
      back to 3500) if not passed explicitly, so it can be overridden per-invocation via
      `--vars '{"lookback_days": N}'` without touching the model.
    arguments:
      - name: column_name
        description: the column name to filter on
      - name: lookback_days
        description: >
          number of days to look back. Defaults to `var('lookback_days', 3500)` if not passed -
          override via `--vars '{"lookback_days": N}'`
      - name: default_date
        description: fallback date (non-dev, incremental) when {{ this }} has no rows yet