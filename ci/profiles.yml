# profiles.yml used only in CI (GitHub Actions). Points DBT_PROFILES_DIR at this
# directory so CI never needs your local ~/.dbt/profiles.yml. No secrets live here —
# host/http_path/token come from env vars backed by GitHub Actions secrets.
dbt-fundamentals:
  target: dev
  outputs:
    dev:
      type: databricks
      database: analytics
      schema: acepeda
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      auth_type: oauth
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      threads: 16
